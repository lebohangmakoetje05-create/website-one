
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="css/style.css">
<header>
      <h1 class="display-3 fw-bold"><img src="lesotho flag.jpg" class="logo"/>Lesotho Tourism</h1>
        </button>
         <div>
          <nav>
          <a href="home.html">Home</a>
          <a href="gallery.html">Gallery</a>
          <a href="about us.html">About Us</a>
          <a href="contact.html">Enquiry Form</a>
          <a href="destination.html">Destinations</a>
        </nav>

        <hr>
      </div>
</header>

</head>

<body class="main">

<div class="container-1">
   <div class="form-title">
    <h1>Registration Form</h1>
     </div>
    <form action="#" method="post">

        <label>Full Name:</label><br>
        <input type="text" name="fullname"
        placeholder="Enter your full name" required>
    <br>
        <label>Email Address:</label><br>
        <input type="email" name="email"
        placeholder="Enter your email" required>
    <br>
        <label>Password:</label><br>
        <input type="password" name="password"
        placeholder="Enter password" required>
    <br>
        <label>Phone Number:</label><br>
        <input type="tel" name="phone"
        placeholder="Enter phone number">
    <br>
        <label>Date of Birth:</label><br>
        <input type="date" name="dob">
    <br>
        <label>Gender:</label><br>
        <select name="gender">
            <option value="">Select Gender</option>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
        </select>
    <br>
        <label>Address:</label><br>
        <textarea name="address"
        placeholder="Enter your address"></textarea>
    <br>
        <button type="submit" class="button1">Register</button>

    </form>

</div>

<div class="container-2">

   <div class="form-title">

    <h1>Event Ticket Booking</h1>
     </div>
     
      <form id="bookingForm" class="form2">

        <label>Full Name:</label><br>
        <input type="text" placeholder="Enter full name" required>
    <br>
        <label>Email Address:</label><br>
        <input type="email" placeholder="Enter email" required>

        <div class="ticket-section">
    <br>
            <h3>Ticket Order</h3>

            <label>Select Ticket Type:</label><br>

            <select id="ticketType" onchange="calculateTotal()">
                <option value="100">Regular - M100</option>
                <option value="200">VIP - M200</option>
                <option value="350">VVIP - M350</option>
            </select>
        <br>
           <label>Destination:</label><br>
            <select name="destination">
                <option value="">Select Destiny</option>
                <option>Katse Dam</option>
                <option>Maletsunyane Falls</option>
                <option>Sehlabathebe Nation Park</option>
            </select>
        <br>
            <label>Number of Tickets:</label><br>

            <input type="number"
                   id="quantity"
                   min="1"
                   value="1"
                   oninput="calculateTotal()">
        <br>
            <div class="total">
                <h3>Total Price:</h3>
                <h2 id="totalPrice">M100.00</h2>
            </div>

        </div>

        <button type="submit" class="button2">Place Order</button>

    </form>

</div>
<hr class="hr2">
<script>

    function calculateTotal() {

        // Get ticket price
        let price = Number(
            document.getElementById("ticketType").value
        );

        // Get number of tickets
        let quantity = Number(
            document.getElementById("quantity").value
        );

        // Calculate total
        let total = price * quantity;

        // Display total price
        document.getElementById("totalPrice").innerHTML ="M" + total.toFixed(2);
    }

    document.getElementById("bookingForm")
    .addEventListener("submit", function(event) {

        event.preventDefault();

        alert("Your ticket order has been placed!");

    });
    function darkmode(){
    var element = document.body;
    element.classList.toggle("dark-mode");
  }


</script>
</body>

   <div class="container py-4 text-center">

  </div>
</footer>
</html>
